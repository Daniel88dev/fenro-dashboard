# Local services for development: `docker compose up -d`, then `pnpm db:migrate`.
# They match DATABASE_URL and PICTURES_S3_* in .env.example. Production uses
# RDS and a private S3 bucket (terraform/).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: fenro
      POSTGRES_PASSWORD: fenro
      POSTGRES_DB: fenro
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # A stand-in for S3, for pictures on tasks. It creates the bucket at start,
  # accepts any key, and keeps the files in the volume. MinIO no longer
  # publishes a free image, hence S3Mock.
  pictures:
    image: adobe/s3mock:5.2.3
    # Its own user cannot write to a fresh volume.
    user: "0"
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: fenro-pictures
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /data
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "9090:9090"
    volumes:
      - pictures-data:/data

volumes:
  postgres-data:
  pictures-data:
