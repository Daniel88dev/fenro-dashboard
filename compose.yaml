services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: fenro
      POSTGRES_PASSWORD: fenro
      POSTGRES_DB: fenro
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # MinIO no longer publishes a free image, hence S3Mock.
  pictures:
    image: adobe/s3mock:5.2.3
    # Its own user cannot write to a fresh volume.
    user: "0"
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: fenro-pictures
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /data
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "9090:9090"
    volumes:
      - pictures-data:/data

volumes:
  postgres-data:
  pictures-data:
