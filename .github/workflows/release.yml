name: Release

# It does not wait for the App Runner deployment: polling kept the job billing
# Actions minutes, so a deployment that fails or rolls back shows in the
# service's event log, not here. Migrations are not run here; they are applied
# by hand before merging a change that adds one (README, "AWS App Runner").
#
# APP_RUNNER_SERVICE_ARN is required: the release fails without it so an
# undeployed image never looks green.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build, push and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # workflow_run also fires for failed and pull-request runs of CI. Only a
    # green CI run for a push to main ships, and a manual run only from main,
    # which is the only ref the AWS role trusts.
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      SERVICE_ARN: ${{ vars.APP_RUNNER_SERVICE_ARN }}
      # The commit CI tested, not whatever main points at by the time this runs.
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
      SITE_URL: https://www.fenro-dashboard.com

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      # Through the API rather than the job's `environment:` key: an
      # environment changes the OIDC subject to `...:environment:Production`,
      # which the AWS deploy role does not trust.
      - name: Record a GitHub deployment
        id: deployment
        run: |
          set -euo pipefail
          id=$(gh api "repos/${GITHUB_REPOSITORY}/deployments" \
            -f ref="${RELEASE_SHA}" \
            -f environment=Production \
            -f description="App Runner release" \
            -F auto_merge=false \
            -F production_environment=true \
            -F 'required_contexts[]' \
            --jq .id)
          echo "id=${id}" >> "$GITHUB_OUTPUT"
          gh api "repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses" \
            -f state=in_progress \
            -f log_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --silent

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # AWS answers a trust-policy mismatch with a bare "Not authorized", so
      # print what this run's token actually claims. Claims only, never the
      # token: they are what the role's sub and aud conditions must match.
      - name: Show the OIDC claims AWS rejected
        if: failure()
        run: |
          set -euo pipefail
          curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" |
            jq -r .value | cut -d. -f2 |
            python3 -c 'import base64, json, sys; p = sys.stdin.read().strip(); print(json.dumps({k: v for k, v in json.loads(base64.urlsafe_b64decode(p + "=" * (-len(p) % 4))).items() if k in ("sub", "aud", "iss", "repository", "ref", "event_name", "job_workflow_ref")}, indent=2))' |
            tee -a "$GITHUB_STEP_SUMMARY"

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          set -euo pipefail
          docker buildx create --use --name release
          sentry_secret=()
          if [ -n "${SENTRY_AUTH_TOKEN}" ]; then
            sentry_secret=(--secret id=sentry_auth_token,env=SENTRY_AUTH_TOKEN)
          fi
          # --provenance=false keeps a single-platform manifest: with
          # provenance, buildx pushes an image index, which App Runner cannot
          # pull.
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --label "org.opencontainers.image.revision=${RELEASE_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --build-arg "SENTRY_RELEASE=${RELEASE_SHA}" \
            --build-arg "SENTRY_ORG=${SENTRY_ORG}" \
            --build-arg "SENTRY_PROJECT=${SENTRY_PROJECT}" \
            "${sentry_secret[@]}" \
            --tag "${IMAGE}:${RELEASE_SHA}" \
            --tag "${IMAGE}:latest" \
            --push \
            .
          echo "Pushed ${IMAGE}:${RELEASE_SHA} and :latest" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to App Runner
        run: |
          set -euo pipefail
          if [ -z "${SERVICE_ARN}" ]; then
            echo "::error::APP_RUNNER_SERVICE_ARN is not set, so the image was pushed but not deployed. Set it to terraform output -raw apprunner_service_arn."
            exit 1
          fi
          # App Runner refuses a deployment while another operation runs on
          # the service, for example a release merged a few minutes earlier.
          # That failure turns the run red; re-run it once the service is idle.
          operation=$(aws apprunner start-deployment \
            --service-arn "$SERVICE_ARN" \
            --query OperationId --output text)
          echo "Started App Runner deployment ${operation} of ${RELEASE_SHA}; its outcome is in the service's event log" >> "$GITHUB_STEP_SUMMARY"

      # Success means App Runner accepted the deployment; the workflow does not
      # wait for it to finish.
      - name: Report the GitHub deployment
        if: always() && steps.deployment.outputs.id
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          OUTCOME: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" = success ]; then
            state=success
            description="App Runner deployment started"
          else
            state=failure
            description="Release ${OUTCOME}"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses" \
            -f state="$state" \
            -f description="$description" \
            -f environment_url="$SITE_URL" \
            -f log_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --silent
